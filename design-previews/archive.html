<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeuBlog — 设计预览 · 归档 v6（焦点线再修正）</title>
<style>
  :root{
    --paper:#faf7f1; --paper-2:#f6efe2; --ink:#2c2620; --ink-soft:#5d564b;
    --rule:#ddd5c5; --accent:#9c2b22; --accent-2:#c2592f; --gold:#b08328;
    --muted:#9a9080;
    --serif:"Noto Serif SC","Source Han Serif SC","Songti SC",Georgia,"Times New Roman",serif;
    --c0:#ece5d7; --c1:#e7b9a8; --c2:#d3795b; --c3:#a83026;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:var(--serif);line-height:1.7;-webkit-font-smoothing:antialiased;font-size:17px}
  .wrap{max-width:1120px;margin:0 auto;padding:0 32px}
  a{color:inherit;text-decoration:none}
  a:hover{color:var(--accent)}

  .topbar{height:5px;background:linear-gradient(90deg,var(--accent) 0%,var(--accent-2) 70%,var(--gold) 100%)}
  .announce{border-bottom:1px solid var(--rule);background:var(--paper-2)}
  .announce .wrap{display:flex;align-items:center;gap:14px;padding:9px 32px;font-size:14px;color:var(--ink-soft)}
  .announce .tag{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#fff;background:var(--accent);padding:2px 8px;border-radius:2px;font-family:Georgia,serif}
  .announce .txt{font-style:italic}
  .announce .x{margin-left:auto;color:var(--muted);cursor:pointer;font-style:normal}

  header.masthead{text-align:center;padding:28px 0 14px;border-bottom:1px solid var(--rule)}
  .masthead .kicker{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--accent-2);font-family:Georgia,serif}
  .masthead h1{font-size:40px;margin:8px 0 4px;letter-spacing:.04em;font-weight:600;color:var(--ink)}
  .masthead .sub{font-style:italic;color:var(--ink-soft);font-size:15px}

  nav.main{border-bottom:1px solid var(--rule);background:var(--paper-2)}
  nav.main .wrap{display:flex;justify-content:center;gap:38px;padding:11px 32px}
  nav.main a{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);font-family:Georgia,serif}
  nav.main a:hover{color:var(--accent)}
  nav.main a.active{color:var(--accent);font-weight:700}

  .pagehead{padding:26px 0 4px}
  .crumb{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:Georgia,serif}
  .crumb a{color:var(--accent)}
  .pagehead h2{font-size:32px;margin:9px 0 4px;font-weight:600}
  .pagehead .lead{font-style:italic;color:var(--ink-soft);margin:0;font-size:15px}

  .layout{display:grid;grid-template-columns:268px 1fr;gap:46px;align-items:start;padding:18px 0 70px}

  /* ===== 跟随焦点侧栏 ===== */
  .side{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto;padding-right:6px}
  .side::-webkit-scrollbar{width:6px}.side::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}
  .side .lbl{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-family:Georgia,serif;margin:0 0 6px}
  .yrow{display:flex;justify-content:space-between;align-items:baseline;padding:10px 8px 10px 12px;cursor:pointer;
    font-family:Georgia,serif;font-size:20px;color:var(--ink);border-left:3px solid transparent;border-bottom:1px solid var(--rule)}
  .yrow:hover{color:var(--accent)}
  .yrow.on{color:var(--accent);font-weight:700;border-left-color:var(--accent);background:var(--paper-2)}
  .yrow .n{font-size:12px;color:var(--muted);font-weight:400}
  .months{margin:2px 0 6px}
  .mrow{display:flex;justify-content:space-between;align-items:baseline;padding:7px 8px 7px 26px;cursor:pointer;font-size:15px;color:var(--ink-soft);border-left:3px solid transparent}
  .mrow.zero{color:var(--muted);cursor:default;opacity:.5}
  .mrow:not(.zero):hover{color:var(--accent)}
  .mrow.on{color:var(--accent);font-weight:700;border-left-color:var(--accent-2)}
  .mrow .n{font-size:11px;color:var(--muted);font-family:Georgia,serif}
  .mrow.on .n{color:var(--accent-2)}

  .minical{margin:5px 8px 12px 26px;padding:10px;border:1px solid var(--rule);background:var(--paper-2);border-radius:2px}
  .minical .cap{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-family:Georgia,serif;margin-bottom:7px;text-align:center}
  .mc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .mc-grid .wd{font-size:10px;color:var(--muted);text-align:center;font-family:Georgia,serif}
  .mc-d{aspect-ratio:1;border-radius:2px;background:var(--c0);display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent}
  .mc-d.blank{background:transparent}
  .mc-d.lv1{background:var(--c1)}.mc-d.lv2{background:var(--c2)}.mc-d.lv3{background:var(--c3)}
  .mc-d.has{cursor:pointer;color:#fff;font-family:Georgia,serif}
  .mc-d.has:hover{outline:2px solid var(--ink);outline-offset:1px}

  /* ===== 右侧内容 ===== */
  .yhead{scroll-margin-top:10px}
  .year{font-size:38px;font-weight:700;color:var(--ink);font-family:Georgia,serif;border-bottom:2px solid var(--accent);padding-bottom:6px;margin:34px 0 6px}
  .yhead:first-child .year{margin-top:8px}
  .year span{font-size:14px;color:var(--accent-2);font-weight:400;font-family:var(--serif);margin-left:12px}

  .yearheat{border-bottom:1px solid var(--rule);background:var(--paper-2);padding:14px 16px 12px;margin-bottom:8px}
  .yh-top{display:flex;align-items:center;gap:12px;margin-bottom:9px}
  .yh-top .t{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-family:Georgia,serif;font-weight:700}
  .legend{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-family:Georgia,serif}
  .legend i{width:11px;height:11px;border-radius:2px;display:inline-block}
  .yh-scroll{overflow-x:auto;padding-bottom:3px}
  .yh-area{display:inline-block}
  .yh-months{display:grid;gap:3px;margin-bottom:3px;height:13px}
  .yh-months span{font-size:10px;color:var(--muted);font-family:Georgia,serif;white-space:nowrap}
  .yh-rowwrap{display:flex;gap:5px}
  .yh-wd{display:grid;grid-template-rows:repeat(7,12px);gap:3px}
  .yh-wd span{font-size:8px;color:var(--muted);height:12px;line-height:12px;width:14px;text-align:right;font-family:Georgia,serif}
  .yh-cells{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px}
  .yh-cells .cell{width:12px;height:12px;border-radius:2px;background:var(--c0)}
  .yh-cells .lv1{background:var(--c1)}.yh-cells .lv2{background:var(--c2)}.yh-cells .lv3{background:var(--c3)}
  .yh-cells .has{cursor:pointer}.yh-cells .has:hover{outline:2px solid var(--ink);outline-offset:1px}
  .yh-cells .empty{background:transparent}

  .month-sec{scroll-margin-top:10px;padding-top:2px}
  .month-h{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-2);font-family:Georgia,serif;font-weight:700;margin:18px 0 2px}
  .month-h span{color:var(--muted);font-weight:400;letter-spacing:0}
  .row{display:grid;grid-template-columns:62px 1fr auto;gap:16px;align-items:baseline;padding:10px 0;border-bottom:1px dotted var(--rule);scroll-margin-top:80px;transition:background .3s}
  .row.flash{background:#f3d9c9}
  .row .date{font-size:13px;color:var(--muted);font-family:Georgia,serif;white-space:nowrap}
  .row .title a:hover{color:var(--accent)}
  .row .cat{font-size:11px;letter-spacing:.1em;color:var(--accent);border:1px solid var(--rule);padding:1px 8px;border-radius:2px;white-space:nowrap}

  footer{border-top:3px double var(--accent);padding:22px 0 40px;text-align:center;color:var(--muted);font-size:13px;font-style:italic}
  body{background-color:var(--paper);background-image:radial-gradient(rgba(44,38,32,.13) 1.5px,transparent 1.7px);background-size:24px 24px;background-attachment:scroll}
  /* sticky 侧栏：强调色调底色，挡住滚动的点阵 */
  /* 侧栏 = 贯穿整页的色条；内容在 .side-inner 内 sticky */
  .side{align-self:stretch;position:static;max-height:none;overflow:visible;padding:0;
    background:#87211a;border-left:4px solid #c96a4a}
  .side-inner{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto;padding:16px 12px 18px 16px}
  .side-inner::-webkit-scrollbar{width:6px}.side-inner::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:3px}
  .side .lbl{color:rgba(255,255,255,.72)}
  .side .yrow{color:#fff6f1;border-bottom-color:rgba(255,255,255,.22)}
  .side .yrow:hover{color:#fff}
  .side .yrow.on{color:#fff;font-weight:700;background:rgba(255,255,255,.16);border-left-color:#fff}
  .side .yrow .n{color:rgba(255,255,255,.72)}
  .side .mrow{color:rgba(255,255,255,.9)}
  .side .mrow.zero{color:rgba(255,255,255,.45)}
  .side .mrow:not(.zero):hover{color:#fff}
  .side .mrow.on{color:#fff;font-weight:700;border-left-color:#fff}
  .side .mrow .n{color:rgba(255,255,255,.72)}
  .side .mrow.on .n{color:#ffe2cf}
.side-inner{scrollbar-width:none;-ms-overflow-style:none} .side-inner::-webkit-scrollbar{width:0;display:none} .side .minical{background:rgba(0,0,0,.16);border-color:rgba(255,255,255,.14)} .side .minical .cap{color:#ffd9c6} .side .mc-grid .wd{color:rgba(255,255,255,.5)} .side .mc-d{background:rgba(255,255,255,.08)} .side .mc-d.lv1{background:#c87a5a} .side .mc-d.lv2{background:#dba07a} .side .mc-d.lv3{background:#f0c39b} .side .mc-d.has{color:#4a160f} .side .mc-d.has:hover{outline-color:#fff}
.side .minical{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18)} .side .mc-d{background:rgba(255,255,255,.14)} .side .mc-d.lv1{background:rgba(255,255,255,.34)} .side .mc-d.lv2{background:rgba(255,255,255,.6)} .side .mc-d.lv3{background:rgba(255,255,255,.92)} .side .mc-d.has{color:#7a241b}
.side .mc-d{background:rgba(255,255,255,.2)} .side .mc-d.lv1{background:rgba(255,255,255,.48)} .side .mc-d.lv2{background:rgba(255,255,255,.74)} .side .mc-d.lv3{background:#ffffff}
.row{scroll-margin-top:14px} .side .minical{background:rgba(255,255,255,.1)} .side .mc-d{background:rgba(255,255,255,.32)} .side .mc-d.lv1{background:rgba(255,255,255,.55)} .side .mc-d.lv2{background:rgba(255,255,255,.8)} .side .mc-d.lv3{background:#ffffff}
.side .minical{background:#f4ece0;border:1px solid rgba(255,255,255,.5)} .side .minical .cap{color:#a83026} .side .mc-grid .wd{color:#9a8d7a} .side .mc-d{background:#e3d6c4} .side .mc-d.lv1{background:var(--c1)} .side .mc-d.lv2{background:var(--c2)} .side .mc-d.lv3{background:var(--c3)} .side .mc-d.has{color:#5a1d18}
</style>
</head>
<body>
  <div class="topbar"></div>
  <div class="announce"><div class="wrap">
    <span class="tag">公告</span><span class="txt">站点已迁移至新服务器，如遇访问异常请稍后重试。— 2026/06/24</span><span class="x">×</span>
  </div></div>
  <header class="masthead"><div class="wrap">
    <div class="kicker">Algorithms · Computer Science · Notes</div><h1>LeuBlog</h1>
    <div class="sub">算法学习记录 与 计算机技术教程</div>
  </div></header>
  <nav class="main"><div class="wrap">
    <a href="#">首页</a><a href="#">分组</a><a href="#">标签</a><a class="active" href="#">归档</a><a href="#">关于</a>
  </div></nav>

  <div class="wrap">
    <div class="pagehead">
      <div class="crumb"><a href="#">首页</a> &nbsp;/&nbsp; 归档</div>
      <h2>归档</h2>
      <p class="lead">按时间浏览全部文章 · 侧栏随阅读焦点自动展开</p>
    </div>
  </div>

  <div class="wrap layout">
    <nav class="side"><div class="side-inner"><div class="lbl">时间线</div><div id="tree"></div></div></nav>
    <div class="content" id="content"></div>
  </div>

  <footer><div class="wrap">LeuBlog · 由 Next.js 与衬线字体驱动 · © 2026</div></footer>

<script>
const MONNUM=m=>`${m}月`;
const WD=["日","一","二","三","四","五","六"];
const pad=n=>String(n).padStart(2,"0");
const lvl=c=>c>=3?"lv3":c===2?"lv2":c>=1?"lv1":"";
const titlePool=["从背包问题理解状态压缩 DP","小服务器上优雅部署全栈应用","最短路三连的取舍","线段树到区间历史最值","KMP 与 Z 函数的统一视角","重读 SICP 的札记","Git 工作流实践","数位 DP 模板与陷阱","手写 FHQ Treap","并查集复杂度证明","用 systemd 管理进程","单调栈与单调队列的本质","扩展欧几里得求逆元","哈希表的开放寻址","快速幂与矩阵加速","AC 自动机入门","可持久化数据结构初探","网络流建模技巧","二叉树遍历的统一范式","莫队算法学习笔记"];
const catPool=["算法","数据结构","系统与工具","读书与杂谈"];
const dist={
  2026:{1:2,2:1,3:3,4:2,5:4,6:5},
  2025:{2:1,4:2,6:1,8:2,9:1,10:1,11:3,12:2},
  2024:{9:2,10:1,11:1,12:1}
};
const years=[2026,2025,2024];

let ti=0;const data={};
function assignDays(count){const base=[5,12,19,26,9,16,23,3,28,15];const a=base.slice(0,count);if(count>=4)a[1]=a[0];return a;}
years.forEach(y=>{
  const posts=[],monthCount={},dayCount={};
  for(let m=1;m<=12;m++)monthCount[m]=0;
  Object.keys(dist[y]).map(Number).sort((a,b)=>b-a).forEach(m=>{
    const cnt=dist[y][m];
    assignDays(cnt).sort((a,b)=>b-a).forEach(d=>{
      const key=`${y}-${pad(m)}-${pad(d)}`;
      posts.push({y,m,d,key,title:titlePool[ti%titlePool.length],cat:catPool[ti%catPool.length]});
      ti++;monthCount[m]++;dayCount[key]=(dayCount[key]||0)+1;
    });
  });
  posts.sort((a,b)=>(b.m-a.m)||(b.d-a.d));
  data[y]={posts,monthCount,dayCount,total:posts.length};
});

function fullYearHeat(y){
  const dc=data[y].dayCount,first=new Date(y,0,1),lead=first.getDay();
  const diy=((y%4===0&&y%100!==0)||y%400===0)?366:365,numCols=Math.ceil((lead+diy)/7);
  let cells="";for(let i=0;i<lead;i++)cells+=`<div class="cell empty"></div>`;
  const monthCol={};
  for(let dd=new Date(y,0,1);dd.getFullYear()===y;dd.setDate(dd.getDate()+1)){
    const key=`${y}-${pad(dd.getMonth()+1)}-${pad(dd.getDate())}`,c=dc[key]||0;
    cells+=`<div class="cell ${lvl(c)} ${c>0?'has':''}" title="${key}${c>0?' · '+c+' 篇':' · 无'}" ${c>0?`onclick="jumpDate('${key}')"`:''}></div>`;
    if(dd.getDate()===1){const idx=lead+Math.floor((dd-first)/86400000);monthCol[dd.getMonth()]=Math.floor(idx/7)+1;}
  }
  let mlabels="";for(let m=0;m<12;m++)mlabels+=`<span style="${monthCol[m]?`grid-column-start:${monthCol[m]}`:''}">${m+1}月</span>`;
  return `<div class="yearheat">
    <div class="yh-top"><span class="t">${y} 全年发布日历</span>
      <span class="legend">少<i style="background:var(--c0)"></i><i style="background:var(--c1)"></i><i style="background:var(--c2)"></i><i style="background:var(--c3)"></i>多</span></div>
    <div class="yh-scroll"><div class="yh-area">
      <div class="yh-months" style="grid-template-columns:repeat(${numCols},12px)">${mlabels}</div>
      <div class="yh-rowwrap"><div class="yh-wd"><span></span><span>一</span><span></span><span>三</span><span></span><span>五</span><span></span></div>
      <div class="yh-cells">${cells}</div></div></div></div></div>`;
}
function renderContent(){
  let h="";
  years.forEach(y=>{
    h+=`<div class="yhead" id="yhead-${y}" data-year="${y}" data-month="">
      <div class="year">${y} <span>${data[y].total} 篇</span></div>${fullYearHeat(y)}</div>`;
    let curM=null;
    data[y].posts.forEach(p=>{
      if(p.m!==curM){curM=p.m;
        h+=`<div class="month-sec" id="m-${y}-${pad(p.m)}" data-year="${y}" data-month="${p.m}">
          <div class="month-h">${MONNUM(p.m)} <span>${data[y].monthCount[p.m]} 篇</span></div>`;}
      h+=`<div class="row" id="d-${p.key}"><span class="date">${pad(p.m)}-${pad(p.d)}</span><span class="title"><a href="#">${p.title}</a></span><span class="cat">${p.cat}</span></div>`;
    });
  });
  // 末尾留白：让最后一个月也能被滚到视口顶部，从而无需任何"下沉补偿"
  h+=`<div class="tail-spacer" style="height:calc(100vh - 160px)" aria-hidden="true"></div>`;
  document.getElementById("content").innerHTML=h;
}
renderContent();

// 焦点块 = .yhead(年总览) 与 .month-sec(月)
const focusBlocks=()=>Array.from(document.querySelectorAll('.yhead, .month-sec'));
let fYear=years[0],fMonth=null;
// 纯顶部检测：焦点 = 视口顶部(base) 处那一块内容。
// 因末尾有留白，每一块都能被滚到顶，无需补偿；焦点推进速度 = 滚动速度。
function detectFocus(){
  const base=20;
  const blocks=focusBlocks();
  if(!blocks.length)return;
  let pick=blocks[0];
  blocks.forEach(b=>{ if(b.getBoundingClientRect().top<=base) pick=b; });
  const ny=+pick.dataset.year, nm=pick.dataset.month===''?null:+pick.dataset.month;
  if(ny!==fYear||nm!==fMonth){fYear=ny;fMonth=nm;renderTree();}
}

function miniCal(y,m){
  const dc=data[y].dayCount,first=new Date(y,m-1,1),lead=first.getDay(),dim=new Date(y,m,0).getDate();
  let cells=WD.map(w=>`<div class="wd">${w}</div>`).join("");
  for(let i=0;i<lead;i++)cells+=`<div class="mc-d blank"></div>`;
  for(let d=1;d<=dim;d++){const key=`${y}-${pad(m)}-${pad(d)}`,c=dc[key]||0;
    cells+=`<div class="mc-d ${lvl(c)} ${c>0?'has':''}" title="${pad(m)}-${pad(d)}${c>0?' · '+c+' 篇':''}" ${c>0?`onclick="jumpDate('${key}')"`:''}>${c>0?c:''}</div>`;}
  return `<div class="minical"><div class="cap">${y} · ${MONNUM(m)}</div><div class="mc-grid">${cells}</div></div>`;
}
function renderTree(){
  let h="";
  years.forEach(y=>{
    h+=`<div class="yrow ${y===fYear?'on':''}" onclick="gotoYear(${y})"><span>${y}</span><span class="n">${data[y].total} 篇</span></div>`;
    if(y===fYear){h+=`<div class="months">`;
      for(let m=12;m>=1;m--){const cnt=data[y].monthCount[m],on=(m===fMonth);
        h+=`<div class="mrow ${cnt===0?'zero':''} ${on?'on':''}" ${cnt>0?`onclick="gotoMonth(${y},${m})"`:''}><span>${MONNUM(m)}</span><span class="n">${cnt}</span></div>`;
        if(on&&cnt>0)h+=miniCal(y,m);}
      h+=`</div>`;}
  });
  const tree=document.getElementById("tree");tree.innerHTML=h;
  const a=tree.querySelector('.mrow.on')||tree.querySelector('.yrow.on');
  if(a)a.scrollIntoView({block:'nearest'});
}

function gotoYear(y){document.getElementById("yhead-"+y).scrollIntoView({behavior:"smooth",block:"start"});}
function gotoMonth(y,m){const el=document.getElementById(`m-${y}-${pad(m)}`);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}
function jumpDate(key){const el=document.getElementById("d-"+key);if(el){el.scrollIntoView({behavior:"smooth",block:"start"});el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1400);}}

let raf=null;
window.addEventListener("scroll",()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=null;detectFocus();});},{passive:true});
window.addEventListener("resize",detectFocus);
detectFocus();renderTree();
</script>
</body>
</html>
