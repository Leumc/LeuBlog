<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeuBlog · 页面未找到</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --paper:#faf7f1; --paper-2:#f6efe2; --ink:#2c2620; --ink-soft:#544e44; --rule:#ddd5c5;
    --accent:#9c2b22; --accent-2:#c2592f; --gold:#b08328; --muted:#9a9080;
    --serif:"Noto Serif SC","Source Han Serif SC","Songti SC",Georgia,serif;
  }
  body{background:var(--paper);color:var(--ink);font-family:var(--serif);min-height:100vh;display:flex;flex-direction:column;line-height:1.8}
  a{color:inherit;text-decoration:none}a:hover{color:var(--accent)}
  .wrap{max-width:760px;margin:0 auto;padding:0 32px;width:100%}

  .topbar{height:5px;background:linear-gradient(90deg,var(--accent) 0%,var(--accent-2) 70%,var(--gold) 100%)}
  nav.main{border-bottom:1px solid var(--rule);background:var(--paper-2)}
  nav.main .inner{max-width:1080px;margin:0 auto;padding:12px 32px;display:flex;align-items:center;gap:28px}
  nav.main .brand{font-size:20px;font-weight:700;margin-right:auto}
  nav.main a{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);font-family:Georgia,serif}
  nav.main a:hover{color:var(--accent)}

  .center{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 20px}
  .box{text-align:center;width:100%;max-width:620px}

  .big{font-family:Georgia,serif;font-size:130px;font-weight:700;line-height:1;color:var(--accent);letter-spacing:.04em}
  .big .mid{color:var(--ink);position:relative}
  .kicker{font-family:Georgia,serif;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent-2);margin-top:6px}
  h1{font-size:30px;font-weight:700;margin:18px 0 10px}
  .lead{font-style:italic;color:var(--ink-soft);font-size:17px;max-width:460px;margin:0 auto 30px}

  .rule{border:none;border-top:1px solid var(--rule);margin:30px 0 24px}

  .go{display:flex;justify-content:center;flex-wrap:wrap;gap:0}
  .go a{font-family:Georgia,serif;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);
    padding:6px 20px;border-right:1px solid var(--rule)}
  .go a:last-child{border-right:none}
  .go a:hover{color:var(--accent)}
  .go a.primary{color:var(--accent);font-weight:700}

  .recent{margin-top:38px;text-align:left}
  .recent .lbl{font-family:Georgia,serif;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);
    border-bottom:2px solid var(--accent);padding-bottom:7px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .recent .lbl::before{content:"";width:8px;height:8px;background:var(--accent);display:inline-block;transform:rotate(45deg)}
  .recent .row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:11px 0;border-bottom:1px solid var(--rule)}
  .recent .row a{font-size:16px}
  .recent .row .d{font-size:12px;color:var(--muted);font-family:Georgia,serif;white-space:nowrap}

  footer{border-top:3px double var(--accent);padding:22px 0 36px;text-align:center;color:var(--muted);font-size:13px;font-style:italic}
  footer .wrap{max-width:1080px}
  body{background-color:var(--paper);background-image:radial-gradient(rgba(44,38,32,.13) 1.5px,transparent 1.7px);background-size:24px 24px;background-attachment:scroll}
</style>
</head>
<body>
  <div class="topbar"></div>
  <nav class="main"><div class="inner">
    <a class="brand" href="#">LeuBlog</a>
    <a href="#">首页</a><a href="#">分组</a><a href="#">标签</a><a href="#">归档</a><a href="#">关于</a>
  </div></nav>

  <div class="center"><div class="box">
    <div class="big">4<span class="mid">0</span>4</div>
    <div class="kicker">Page Not Found</div>
    <h1>这一页走丢了</h1>
    <p class="lead">你要找的页面可能已被移动、删除，或从未存在过。不如从下面这些入口继续逛逛。</p>

    <div class="go">
      <a class="primary" href="#">← 返回首页</a>
      <a href="#">分组</a>
      <a href="#">标签</a>
      <a href="#">归档</a>
      <a href="#">关于</a>
    </div>

    <hr class="rule">

    <div class="recent">
      <div class="lbl">也许你想读</div>
      <div class="row"><a href="#">二叉树入门：从定义到遍历</a><span class="d">06 / 24</span></div>
      <div class="row"><a href="#">从背包问题理解状态压缩 DP 的本质</a><span class="d">06 / 22</span></div>
      <div class="row"><a href="#">在 2 核 2G 小服务器上优雅地部署全栈应用</a><span class="d">06 / 18</span></div>
      <div class="row"><a href="#">最短路三连：Dijkstra、Bellman-Ford 与 SPFA</a><span class="d">06 / 14</span></div>
    </div>
  </div></div>

  <footer><div class="wrap">LeuBlog · 由 Next.js 与衬线字体驱动 · © 2026</div></footer>
</body>
</html>
